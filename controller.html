<!doctype html>

  <script>
    tailwind.config = {

  <style>
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #06060e;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #root {
      position: absolute;
      inset: 0;
      height: 100%;
      /* 上下のセーフエリアは、ヘッダーと最下部の帯がそれぞれ背景ごと取り込む（v10）。
         ここで padding を付けると、その分だけ表示範囲が狭くなる */
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      box-sizing: border-box;
    }
    /* 背の低い画面（iPhone SEなど）では上下の固定部分を少し詰めて、表示範囲を確保する */
    @media (max-height: 700px) {
      .tk-tab-btn { height: 42px !important; }
      .tk-tab-pill { height: 42px !important; }
      .tk-strip { height: calc(34px + max(0px, calc(env(safe-area-inset-bottom, 0px) - 12px))) !important; }

    /* タブ切り替え時の画面アニメーション（右隣のタブへ=右から、左隣のタブへ=左から） */

    @keyframes tabInFromLeft {

    .sortable-ghost {

    /* iPhone SE / 小画面端末向け 微調整 */

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const defaultQuickLabelWords = ["番組残り", "VTR残り", "コーナー残り", "アナ締めまで"];

    const colors = {
      bg: '#06060e',
      surface: '#0f0f1c',
      card: '#131325',
      cardHover: '#181830',
      border: '#22223a',
      amber: '#f0a030',
      amberDim: '#6b4814',
      amberGlow: 'rgba(240,160,48,0.15)',
      red: '#ff4a4a',
      redGlow: 'rgba(255,74,74,0.2)',
      green: '#28e07a',
      greenGlow: 'rgba(40,224,122,0.15)',
      blue: '#60a8ff',
      blueGlow: 'rgba(96,168,255,0.15)',
      cyan: '#00f0ff',
      cyanGlow: 'rgba(0,240,255,0.15)',
      white: '#dce0f8',
      gray: '#44445a',
      muted: '#666688',
      mutedLight: '#8888aa',
      mono: "'Share Tech Mono','Courier New',monospace",
      sans: "'Rajdhani',system-ui,sans-serif"
    };

    const labelStyle = {
      fontSize: 9,
      letterSpacing: 4,
      color: colors.muted,
      textTransform: 'uppercase',
      fontFamily: colors.sans,
      fontWeight: 600
    };

    const pad = (num) => String(Math.abs(Math.floor(num))).padStart(2, "0");

    function formatTime(ms) {
      const abs = Math.abs(ms);
      const h = Math.floor(abs / 3600000);
      const m = Math.floor((abs % 3600000) / 60000);
      const s = Math.floor((abs % 60000) / 1000);
      const sign = ms < 0 ? "−" : "";
      if (h > 0) {
        return sign + `${pad(h)}:${pad(m)}:${pad(s)}`;
      }
      return sign + `${pad(m)}:${pad(s)}`;
    }

    function formatFullHMS(ms) {
      const abs = Math.abs(ms);
      const h = Math.floor(abs / 3600000);
      const m = Math.floor((abs % 3600000) / 60000);
      const s = Math.floor((abs % 60000) / 1000);
      const sign = ms < 0 ? "−" : "";
      return sign + `${pad(h)}:${pad(m)}:${pad(s)}`;
    }

    function formatTimeMs(ms) {
      const abs = Math.abs(ms);
      const h = Math.floor(abs / 3600000);
      const m = Math.floor((abs % 3600000) / 60000);
      const s = Math.floor((abs % 60000) / 1000);
      const centi = Math.floor((abs % 1000) / 10);
      const sign = ms < 0 ? "−" : "";
      const timeStr = h > 0 
        ? `${pad(h)}:${pad(m)}:${pad(s)}` 
        : `${pad(Math.floor(abs / 60000))}:${pad(s)}`;
      return `${sign}${timeStr}.${pad(centi)}`;
    }

    function parseInputDigits(str) {
      if (!str) return null;
      const clean = str.trim();
      if (!clean) return null;

      if (clean.endsWith("s")) {
        const val = parseInt(clean.replace(/\D/g, ""), 10);
        if (isNaN(val)) return null;
        const ms = val * 1000;
        const h = Math.floor(ms / 3600000);
        const m = Math.floor((ms % 3600000) / 60000);
        const s = Math.floor((ms % 60000) / 1000);
        return { h, m, s, ms, str: `${val}秒 (${pad(h)}:${pad(m)}:${pad(s)})` };
      }

      if (clean.endsWith("m")) {
        const val = parseInt(clean.replace(/\D/g, ""), 10);
        if (isNaN(val)) return null;
        const ms = val * 60000;
        const h = Math.floor(ms / 3600000);
        const m = Math.floor((ms % 3600000) / 60000);
        const s = Math.floor((ms % 60000) / 1000);
        return { h, m, s, ms, str: `${val}分 (${pad(h)}:${pad(m)}:${pad(s)})` };
      }

      const digits = clean.replace(/\D/g, "").slice(0, 6);
      if (!digits) return null;
      const padded = digits.padStart(6, "0");
      const s = parseInt(padded.slice(4, 6), 10);
      const m = parseInt(padded.slice(2, 4), 10);
      const h = parseInt(padded.slice(0, 2), 10);
      if (s >= 60 || m >= 60) return null;
      const ms = (h * 3600 + m * 60 + s) * 1000;
      return { h, m, s, ms, str: `${pad(h)}:${pad(m)}:${pad(s)}` };
    }

    // CALC専用の解釈：接尾辞なしの数字は、2桁まで（99まで）を「秒数」として扱い分:秒へ変換する
    // （例：90→1:30、75→1:15）。3桁以上は従来のHHMMSS右詰め解釈を優先し、
    // それで解釈できない場合（秒・分が60以上）だけ、数字全体を秒数として変換する（例：160→2:40）。
    function parseCalculatorToken(token) {
      if (!token) return null;
      if (token.endsWith("s") || token.endsWith("m")) return parseInputDigits(token);
      const digits = token.replace(/\D/g, "");
      if (!digits) return null;
      if (digits.length <= 2) {
        const ms = parseInt(digits, 10) * 1000;
        const h = Math.floor(ms / 3600000);
        const m = Math.floor((ms % 3600000) / 60000);
        const s = Math.floor((ms % 60000) / 1000);
        return { h, m, s, ms, str: `${pad(h)}:${pad(m)}:${pad(s)}` };
      }
      const parsed = parseInputDigits(token);
      if (parsed) return parsed;
      const ms = parseInt(digits, 10) * 1000;
      const h = Math.floor(ms / 3600000);
      const m = Math.floor((ms % 3600000) / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      return { h, m, s, ms, str: `${pad(h)}:${pad(m)}:${pad(s)}` };
    }

    function parseCalculatorFormula(expr) {
      if (!expr) return 0;
      const tokens = expr.split(/([+-])/).filter(t => t !== "");
      let totalMs = 0;
      let currentOp = "+";
      for (const token of tokens) {
        if (token === "+" || token === "-") {
          currentOp = token;
          continue;
        }
        const parsed = parseCalculatorToken(token);
        const ms = parsed ? parsed.ms : 0;
        totalMs = currentOp === "+" ? totalMs + ms : totalMs - ms;
      }
      return totalMs;
    }

    function formatCalculatorFormula(expr) {
      if (!expr) return "";
      return expr.split(/([+-])/).map(token => {
        if (token === "+" || token === "-") return token;
        const parsed = parseCalculatorToken(token);
        if (!parsed) return token;

        if (token.endsWith("s") || token.endsWith("m")) {
          return token;
        }

        const ms = parsed.ms;
        const h = Math.floor(ms / 3600000);
        return h > 0 
          ? `${pad(h)}:${pad(Math.floor((ms % 3600000) / 60000))}:${pad(Math.floor((ms % 60000) / 1000))}` 
          : `${pad(Math.floor(ms / 60000))}:${pad(Math.floor((ms % 60000) / 1000))}`;
      }).join("");
    }

    function endsWithOperator(expr) {
      return !!(expr && /[+-]$/.test(expr));
    }

    function roundUpToSecond(ms) {
      return ms <= 0 ? 0 : Math.ceil(ms / 1000) * 1000;
    }
    
    function formatTo6Digits(ms) {
      const abs = Math.abs(ms);
      const h = Math.floor(abs / 3600000);
      const m = Math.floor((abs % 3600000) / 60000);
      const s = Math.floor((abs % 60000) / 1000);
      const sign = ms < 0 ? "-" : "";
      return `${sign}${pad(h)}${pad(m)}${pad(s)}`;
    }

    // CD（指定時刻カウントダウン）の目標を1件作る。CountdownManager の addTarget と同じ規則：
    // rawTime は6桁HHMMSS形式（parseInputDigits で解釈）、仮想時刻（timeOffset 込み）の当日に合わせ、
    // 既に過ぎていたら翌日に回す。解釈できなければ null。
    function buildCountdownTarget(rawTime, label, timeOffset = 0) {
      const parsed = parseInputDigits(rawTime);
      if (!parsed) return null;
      const virtualNow = Date.now() + timeOffset;
      const now = new Date(virtualNow);
      now.setHours(parsed.h, parsed.m, parsed.s, 0);
      let targetMs = now.getTime();
      if (targetMs <= virtualNow) {
        targetMs += 86400000;
      }
      return { id: Date.now() + Math.random(), target: targetMs, label };
    }

    // ===== キューシート読み取り（写真OCR→タイマー一括作成） =====

    // 時間表記のゆれをそろえる（全角数字・全角コロン・引用符など）
    function normalizeTimeText(str) {
      return String(str || "")
        .replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
        .replace(/：/g, ":")
        .replace(/[＇’′]/g, "'")
        .replace(/[＂”″]/g, '"');
    }

    const CUE_MAX_MS = 12 * 3600 * 1000; // 尺としてあり得る上限（12時間）

    // テキスト中から時間トークンを1つ探す。見つかれば { ms, index, length }、なければ null。
    // allowBareDigits=false のときは「330」のような数字だけの表記を対象にしない。
    // ※正規表現の後読み・先読みは古いSafariで構文エラーになるため使わず、境界は手動で確認する。
    function findDurationToken(text, allowBareDigits = true) {
      const s = String(text || "");
      const inRange = (ms) => ms > 0 && ms <= CUE_MAX_MS;
      const charAt = (i) => (i >= 0 && i < s.length ? s[i] : "");
      const tryPatterns = (regex, toMs, guard) => {
        regex.lastIndex = 0;
        let m;
        while ((m = regex.exec(s)) !== null) {
          if (guard && !guard(m)) continue;
          const ms = toMs(m);
          if (ms != null && inRange(ms)) return { ms, index: m.index, length: m[0].length };
        }
        return null;
      };
      const boundaryGuard = (m) => {
        const prev = charAt(m.index - 1);
        const next = charAt(m.index + m[0].length);
        return !/[\d:]/.test(prev) && !/[\d:]/.test(next);
      };
      // 3分30秒
      let r = tryPatterns(/(\d{1,3})\s*分\s*(\d{1,2})\s*秒/g,
        (m) => (parseInt(m[1], 10) * 60 + parseInt(m[2], 10)) * 1000);
      if (r) return r;
      // 1時間30分 / 1時間30分20秒 / 2時間
      r = tryPatterns(/(\d{1,2})\s*時間\s*(?:(\d{1,2})\s*分)?\s*(?:(\d{1,2})\s*秒)?/g,
        (m) => (parseInt(m[1], 10) * 3600 + (m[2] ? parseInt(m[2], 10) * 60 : 0) + (m[3] ? parseInt(m[3], 10) : 0)) * 1000);
      if (r) return r;
      // 5分（直前が「時」のときは時刻の一部とみなして除外する）
      r = tryPatterns(/(\d{1,4})\s*分/g, (m) => parseInt(m[1], 10) * 60000,
        (m) => !/時\s*$/.test(s.slice(0, m.index)));
      if (r) return r;
      // 45秒
      r = tryPatterns(/(\d{1,4})\s*秒/g, (m) => parseInt(m[1], 10) * 1000);
      if (r) return r;
      // 1:02:30
      r = tryPatterns(/(\d{1,2}):(\d{2}):(\d{2})/g,
        (m) => {
          const mm = parseInt(m[2], 10), ss = parseInt(m[3], 10);
          return (mm < 60 && ss < 60) ? (parseInt(m[1], 10) * 3600 + mm * 60 + ss) * 1000 : null;
        }, boundaryGuard);
      if (r) return r;
      // 3:30
      r = tryPatterns(/(\d{1,3}):(\d{2})/g,
        (m) => {
          const ss = parseInt(m[2], 10);
          return ss < 60 ? (parseInt(m[1], 10) * 60 + ss) * 1000 : null;
        }, boundaryGuard);
      if (r) return r;
      // 3'30"
      r = tryPatterns(/(\d{1,3})\s*'\s*(\d{1,2})\s*"?/g,
        (m) => {
          const ss = parseInt(m[2], 10);
          return ss < 60 ? (parseInt(m[1], 10) * 60 + ss) * 1000 : null;
        });
      if (r) return r;
      // 330（HHMMSS）。年月日・円・通貨記号に隣接する数字は対象にしない
      if (allowBareDigits) {
        r = tryPatterns(/(\d{3,6})/g, (m) => {
          const p = parseInputDigits(m[1]);
          return p ? p.ms : null;
        }, (m) => {
          const prev = charAt(m.index - 1);
          const next = charAt(m.index + m[0].length);
          return !/[\d¥￥]/.test(prev) && !/[\d年月日円]/.test(next);
        });
        if (r) return r;
      }
      return null;
    }

    // 単独の時間表記（確認画面の時間欄など）をミリ秒に変換する。変換できなければ null。
    function parseFlexibleDuration(str) {
      if (!str) return null;
      const s = normalizeTimeText(str).trim();
      if (!s) return null;
      if (/^\d{1,2}$/.test(s)) {
        const ms = parseInt(s, 10) * 1000; // 「90」は90秒（1分30秒）として解釈する
        return ms > 0 && ms <= CUE_MAX_MS ? ms : null;
      }
      const found = findDurationToken(s, true);
      if (!found) return null;
      const rest = (s.slice(0, found.index) + s.slice(found.index + found.length)).trim();
      if (rest) return null; // 時間以外の文字が残っていたら不正とする
      return found.ms;
    }

    // 時刻らしい行だと判断する手がかりになる語（番組の開始・終了などの絶対時刻はCDに入れる）
    const CUE_CLOCK_KEYWORDS = ["開始", "終了", "スタート", "エンド", "本番", "入り", "ハケ", "集合", "開演", "終演", "開場"];

    // 文字列の一部（{index, length}）を同じ長さの空白に置き換える。位置（index）がずれないため、
    // 複数トークンを扱っても残りの探索範囲がそのまま使える。
    function maskSpan(text, span) {
      const s = String(text || "");
      if (!span) return s;
      return s.slice(0, span.index) + " ".repeat(span.length) + s.slice(span.index + span.length);
    }

    // 強い時刻トークンを1つ探す。見つかれば { h, m, s, index, length }、なければ null。
    // ・「18時30分」型は常に時刻（「18時間」のような尺表記は除く）
    // ・「18:03:30」型は13時以降（尺ではあり得ない）か、キーワードのある行でのみ時刻
    // ・「18:30」型と「1830」型はキーワードのある行でのみ時刻（通常行では尺を優先する）
    // ※後読み・先読みは使わず、境界は手動で確認する（findDurationToken と同方針）。
    function findClockToken(text, hasKeyword) {
      const s = String(text || "");
      const charAt = (i) => (i >= 0 && i < s.length ? s[i] : "");
      const boundaryGuard = (m) => {
        const prev = charAt(m.index - 1);
        const next = charAt(m.index + m[0].length);
        return !/[\d:]/.test(prev) && !/[\d:]/.test(next);
      };
      const scan = (regex, toClock, guard) => {
        regex.lastIndex = 0;
        let m;
        while ((m = regex.exec(s)) !== null) {
          if (guard && !guard(m)) continue;
          const c = toClock(m);
          if (c) return { h: c.h, m: c.m, s: c.s, index: m.index, length: m[0].length };
        }
        return null;
      };
      // 18時30分 / 18時30分20秒 / 18時
      let r = scan(/(\d{1,2})\s*時\s*(?:(\d{1,2})\s*分)?\s*(?:(\d{1,2})\s*秒)?/g,
        (m) => {
          const h = parseInt(m[1], 10);
          const mi = m[2] ? parseInt(m[2], 10) : 0;
          const se = m[3] ? parseInt(m[3], 10) : 0;
          return (h <= 23 && mi < 60 && se < 60) ? { h, m: mi, s: se } : null;
        },
        (m) => {
          if (/[\d]/.test(charAt(m.index - 1))) return false;
          // 「分」まで無いのに直後が「間」なら尺（○時間）の始まりなので時刻にしない
          if (!m[2] && charAt(m.index + m[0].length) === "間") return false;
          return true;
        });
      if (r) return r;
      // 18:03:30
      r = scan(/(\d{1,2}):(\d{2}):(\d{2})/g,
        (m) => {
          const h = parseInt(m[1], 10), mi = parseInt(m[2], 10), se = parseInt(m[3], 10);
          return (mi < 60 && se < 60 && h <= 23 && (h >= 13 || hasKeyword)) ? { h, m: mi, s: se } : null;
        }, boundaryGuard);
      if (r) return r;
      if (hasKeyword) {
        // 18:30（キーワードのある行のみ）
        r = scan(/(\d{1,2}):(\d{2})/g,
          (m) => {
            const h = parseInt(m[1], 10), mi = parseInt(m[2], 10);
            return (h <= 23 && mi < 60) ? { h, m: mi, s: 0 } : null;
          }, boundaryGuard);
        if (r) return r;
        // 1830 / 183000（キーワードのある行のみ。年・金額に隣接する数字は対象外）
        r = scan(/(\d{6}|\d{4})/g,
          (m) => {
            const d = m[1];
            const h = parseInt(d.slice(0, 2), 10);
            const mi = parseInt(d.slice(2, 4), 10);
            const se = d.length === 6 ? parseInt(d.slice(4, 6), 10) : 0;
            return (h <= 23 && mi < 60 && se < 60) ? { h, m: mi, s: se } : null;
          },
          (m) => {
            const prev = charAt(m.index - 1);
            const next = charAt(m.index + m[0].length);
            return !/[\d¥￥]/.test(prev) && !/[\d年月日円]/.test(next);
          });
        if (r) return r;
      }
      return null;
    }

    // 弱い時刻候補：13〜23時の「18:03」型。単独では尺を優先し、同じ行に別の尺がある
    // （＝時刻列＋尺列の併記）場合だけ時刻とみなす。判定は呼び出し側で行う。
    function findWeakClockToken(text) {
      const s = String(text || "");
      const re = /(\d{1,2}):(\d{2})/g;
      let m;
      while ((m = re.exec(s)) !== null) {
        const prev = m.index > 0 ? s[m.index - 1] : "";
        const next = m.index + m[0].length < s.length ? s[m.index + m[0].length] : "";
        if (/[\d:]/.test(prev) || /[\d:]/.test(next)) continue;
        const h = parseInt(m[1], 10), mi = parseInt(m[2], 10);
        if (h >= 13 && h <= 23 && mi < 60) return { h, m: mi, s: 0, index: m.index, length: m[0].length };
      }
      return null;
    }

    // 単独の時刻表記（確認画面でCD行の時間欄など）を { h, m, s } に変換する。変換できなければ null。
    function parseClockTime(str) {
      if (!str) return null;
      const s = normalizeTimeText(str).replace(/\s+/g, "");
      if (!s) return null;
      const ok = (h, mi, se) => (h <= 23 && mi < 60 && se < 60) ? { h, m: mi, s: se } : null;
      let m = s.match(/^(\d{1,2})時(?:(\d{1,2})分)?(?:(\d{1,2})秒)?$/);
      if (m) return ok(parseInt(m[1], 10), m[2] ? parseInt(m[2], 10) : 0, m[3] ? parseInt(m[3], 10) : 0);
      m = s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
      if (m) return ok(parseInt(m[1], 10), parseInt(m[2], 10), m[3] ? parseInt(m[3], 10) : 0);
      if (/^\d{3}$/.test(s)) return ok(parseInt(s[0], 10), parseInt(s.slice(1), 10), 0);
      if (/^\d{4}$/.test(s)) return ok(parseInt(s.slice(0, 2), 10), parseInt(s.slice(2), 10), 0);
      if (/^\d{6}$/.test(s)) return ok(parseInt(s.slice(0, 2), 10), parseInt(s.slice(2, 4), 10), parseInt(s.slice(4), 10));
      return null;
    }

    // 時刻 { h, m, s } を表示用テキストにする（秒が0なら省略）
    function formatClockText(clock) {
      if (!clock) return "";
      return clock.s > 0
        ? `${pad(clock.h)}:${pad(clock.m)}:${pad(clock.s)}`
        : `${pad(clock.h)}:${pad(clock.m)}`;
    }

    // OCRテキストから「ラベル＋尺／時刻」の組を抽出する。時間のない行は読み飛ばす。
    // 尺は { label, kind: "tm", ms }、時刻は { label, kind: "cd", clock: { h, m, s } } を返す。
    // 1行に尺と時刻の両方がある場合は両方を拾う（確認画面で振り分け直せる）。
    function parseCueSheetText(text) {
      if (!text) return [];
      const rows = [];
      const lines = normalizeTimeText(text).split(/\r?\n/);
      for (const rawLine of lines) {
        if (rows.length >= 100) break;
        const line = rawLine.trim();
        if (!line) continue;
        const hasKeyword = CUE_CLOCK_KEYWORDS.some((k) => line.includes(k));
        let clock = findClockToken(line, hasKeyword);
        if (!clock) {
          // 「18:03」のような時刻候補は、同じ行に別の尺がある場合だけ時刻とみなす（単独なら尺優先）
          const weak = findWeakClockToken(line);
          if (weak && findDurationToken(maskSpan(line, weak), true)) clock = weak;
        }
        // 尺は時刻トークンを除いた範囲から探す（「18時30分」内の「30分」を尺と誤認しないため）
        const duration = findDurationToken(clock ? maskSpan(line, clock) : line, true);
        if (!clock && !duration) continue;
        let label = line;
        if (clock) label = maskSpan(label, clock);
        if (duration) label = maskSpan(label, duration);
        // 累計時刻など、残った時間・時刻表記もラベルから取り除く（数字だけの表記は対象外）
        for (let i = 0; i < 3; i++) {
          const extra = findDurationToken(label, false) || findClockToken(label, false);
          if (!extra) break;
          label = maskSpan(label, extra);
        }
        label = label
          .replace(/^[・\-—―\*※#>\s　]+/, "")
          .replace(/^[\(（]?[\d]{1,3}[\.\)）、:：]?\s+/, "") // 先頭のキュー番号
          .replace(/[:：|｜…‥\-—―]+\s*$/, "")
          .replace(/\s+/g, " ")
          .trim();
        if (duration) rows.push({ label, kind: "tm", ms: duration.ms });
        if (clock) rows.push({ label, kind: "cd", clock: { h: clock.h, m: clock.m, s: clock.s } });
      }
      return rows;
    }

    // Tesseract.js（OCRライブラリ）を必要になった時点で読み込む（起動時には読み込まない）
    const TESSERACT_CDN_URL = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    let tesseractLoadPromise = null;
    function loadTesseractLib() {
      if (window.Tesseract) return Promise.resolve(window.Tesseract);
      if (tesseractLoadPromise) return tesseractLoadPromise;
      tesseractLoadPromise = new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = TESSERACT_CDN_URL;
        script.onload = () => {
          if (window.Tesseract) resolve(window.Tesseract);
          else {
            tesseractLoadPromise = null;
            reject(new Error("OCRライブラリの読み込みに失敗しました"));
          }
        };
        script.onerror = () => {
          tesseractLoadPromise = null;
          reject(new Error("OCRライブラリを読み込めませんでした。通信環境を確認して、もう一度お試しください"));
        };
        document.head.appendChild(script);
      });
      return tesseractLoadPromise;
    }

    // 大きすぎる写真をOCR用に縮小する（長辺2000px）。失敗したら元のファイルをそのまま返す。
    function fileToScaledImage(file, maxSize = 2000) {
      return new Promise((resolve) => {
        let url;
        try { url = URL.createObjectURL(file); } catch (e) { resolve(file); return; }
        const img = new Image();
        img.onload = () => {
          try {
            const w = img.naturalWidth, h = img.naturalHeight;
            const scale = Math.min(1, maxSize / Math.max(w, h));
            if (!w || !h || scale >= 1) { URL.revokeObjectURL(url); resolve(file); return; }
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(w * scale);
            canvas.height = Math.round(h * scale);
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(url);
            if (canvas.toBlob) canvas.toBlob((b) => resolve(b || file), "image/jpeg", 0.9);
            else resolve(file);
          } catch (e) { URL.revokeObjectURL(url); resolve(file); }
        };
        img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
        img.src = url;
      });
    }

    function useLowPowerTrigger(mode = "low") {
      const [, setTick] = useState(0);
      const timerRef = useRef(null);
      const [isPageVisible, setIsPageVisible] = useState(!document.hidden);

      useEffect(() => {
        const onVisibilityChange = () => setIsPageVisible(!document.hidden);
        document.addEventListener("visibilitychange", onVisibilityChange);
        return () => document.removeEventListener("visibilitychange", onVisibilityChange);
      }, []);

      useEffect(() => {
        if (!isPageVisible || mode === "none") return;

        if (mode === "high") {
          let active = true;
          const loop = () => {
            if (!active) return;
            setTick(t => t + 1);
            timerRef.current = requestAnimationFrame(loop);
          };
          timerRef.current = requestAnimationFrame(loop);
          return () => {
            active = false;
            if (timerRef.current) cancelAnimationFrame(timerRef.current);
          };
        } else {
          const interval = setInterval(() => {
            setTick(t => t + 1);
          }, 200);
          timerRef.current = interval;
          return () => clearInterval(interval);
        }
      }, [mode, isPageVisible]);
    }

    function useKeyboardSafeViewport(active) {
      const [rect, setRect] = useState({ top: 0, height: window.innerHeight });

      useEffect(() => {
        if (!active) return;
        const vv = window.visualViewport;
        if (!vv) return;

        const update = () => setRect({ top: vv.offsetTop, height: vv.height });
        update();
        vv.addEventListener("resize", update);
        vv.addEventListener("scroll", update);
        return () => {
          vv.removeEventListener("resize", update);
          vv.removeEventListener("scroll", update);
        };
      }, [active]);

      return rect;
    }

      const startX = useRef(0);
      const startY = useRef(0);
      const currentTx = useRef(0);
      const swipeState = useRef('closed');
      const isHorizontalMove = useRef(false);
      const lastTapTime = useRef(0);
      const hasMoved = useRef(false);
      
      const runningTimers = timers.filter(t => t.running);
      const swipeLimitLeft = 140;
      const swipeLimitRight = 200;

      const handlePointerDown = (e) => {
        if (e.target.closest('.no-drag')) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        startX.current = e.clientX;
        startY.current = e.clientY;
        isDraggingRef.current = true;
        isHorizontalMove.current = false;
        hasMoved.current = false;
        
        let initialOffset = 0;
        if (swipeState.current === 'left') initialOffset = -swipeLimitLeft;
        if (swipeState.current === 'right') initialOffset = swipeLimitRight;
        currentTx.current = initialOffset;
      };

      const handlePointerMove = (e) => {
        if (!isDraggingRef.current) return;
        const deltaX = e.clientX - startX.current;
        const deltaY = e.clientY - startY.current;

        if (!isHorizontalMove.current) {
          if (Math.abs(deltaX) > 8 && Math.abs(deltaX) > Math.abs(deltaY)) {
            isHorizontalMove.current = true;
            try { cardRef.current?.setPointerCapture(e.pointerId); } catch (_) {}
          } else if (Math.abs(deltaY) > 8) {
            isDraggingRef.current = false;
            return;
          }
        }

        if (isHorizontalMove.current) {
          hasMoved.current = true;
          let nextTx = currentTx.current + deltaX;
          nextTx = Math.max(-swipeLimitLeft, Math.min(swipeLimitRight, nextTx));
          setTranslateX(nextTx);
        }
      };

      const handlePointerUp = (e) => {
        if (!isDraggingRef.current && !isHorizontalMove.current) return;
        isDraggingRef.current = false;
        try { cardRef.current?.releasePointerCapture(e.pointerId); } catch(_) {}
        
        if (translateX < -swipeLimitLeft * 0.4) {
          setTranslateX(-swipeLimitLeft);
          swipeState.current = 'left';
        } else if (translateX > swipeLimitRight * 0.35) {
          setTranslateX(swipeLimitRight);
          swipeState.current = 'right';
        } else {
          setTranslateX(0);
          swipeState.current = 'closed';
        }
      };

      const handlePointerCancel = (e) => {
        if (!isDraggingRef.current) return;
        isDraggingRef.current = false;
        try { cardRef.current?.releasePointerCapture(e.pointerId); } catch(_) {}
        let orig = 0;
        if (swipeState.current === 'left') orig = -swipeLimitLeft;
        if (swipeState.current === 'right') orig = swipeLimitRight;
        setTranslateX(orig);
      };

      const handleCardClick = (e) => {
        if (e.target.closest('.no-drag')) return;
        if (hasMoved.current) return;

        if (swipeState.current !== 'closed') {
          setTranslateX(0);
          swipeState.current = 'closed';
          return;
        }
        const now = Date.now();
        if (now - lastTapTime.current < 350) {
          lastTapTime.current = 0;
          if (onOpenOutput) onOpenOutput(item.id);
        } else {
          lastTapTime.current = now;
        }
      };

      const targetTimeString = new Date(item.target).toLocaleTimeString("ja-JP", {
        hour: "2-digit", minute: "2-digit", second: "2-digit"
      });

      const isRightSwiped = translateX > 20;

      return (
        <div data-id={item.id} data-swipe-card="1" className="relative overflow-hidden rounded-xl mb-1.5 select-none cd-card-h" style={{ height: '78px' }}>
          {/* 右スワイプ裏レイヤー: TM稼働計算結果 */}
          <div 
            className="absolute inset-y-0 left-0 flex flex-col justify-center bg-gradient-to-r from-[#031525] to-[#09223a] border-r-2 border-cyanCustom no-drag rounded-l-xl transition-opacity duration-150 px-2.5 z-0"
            style={{ 
              width: `${swipeLimitRight}px`,
              opacity: translateX > 0 ? Math.min(1, translateX / 35) : 0
            }}
          >
            {runningTimers.length === 0 ? (
              <div className="flex flex-col items-start justify-center h-full">
                <div className="flex items-center gap-1 text-[10px] font-bold text-cyanCustom tracking-wide uppercase">
                  <span>✦ TMタイマー差分</span>
                </div>
                <div className="font-sans text-[11px] text-mutedLight mt-0.5">稼働中のタイマーなし</div>
              </div>
            ) : runningTimers.length === 1 ? (
              (() => {
                const tm = runningTimers[0];
                const tmRemaining = Math.max(0, (tm.endAt - virtualNow) - (tmSteal > 0 ? tmSteal * 1000 : 0));
                const subDiff = diffMs - tmRemaining;
                const isSubPast = subDiff < 0;
                const displaySubMs = roundUpToSecond(Math.abs(subDiff));
                const subColor = isSubPast ? colors.red : colors.cyan;

                return (
                  <div className="flex flex-col justify-center h-full">
                    <div className="flex items-center justify-between gap-1 mb-0.5">
                      <span className="text-[8px] font-bold tracking-[1px] uppercase truncate" style={{ color: subColor }}>
                        {isSubPast ? "⚠️ CD先行/不足" : "✓ TM後余力"}
                      </span>
                      <span className="font-sans text-[10px] text-whiteCustom truncate font-bold max-w-[80px]">
                        {tm.label || formatTime(tm.totalMs)}
                      </span>
                    </div>
                    
                    <div className="flex items-baseline gap-1.5">
                      <div 
                        className="font-mono text-[26px] font-extrabold leading-none tracking-tight"
                        style={{ color: subColor, textShadow: `0 0 10px ${subColor}55` }}
                      >
                        {isSubPast ? "−" : "+"}{formatTime(displaySubMs)}
                      </div>
                      <span className="text-[9px] font-bold font-sans" style={{ color: subColor }}>
                        {isSubPast ? "不足" : "残"}
                      </span>
                    </div>

                    <div className="font-mono text-[8px] text-mutedLight/70 flex justify-between mt-0.5">
                      <span>TM残:{formatTime(tmRemaining)}</span>
                      <span>CD残:{formatTime(diffMs)}</span>
                    </div>
                  </div>
                );
              })()
            ) : (
              <div className="flex flex-col gap-1 overflow-y-auto max-h-[70px] pr-1 py-0.5">
                <div className="text-[8px] font-bold text-cyanCustom tracking-[1px] uppercase sticky top-0 bg-[#031525] pb-0.5">
                  TM終了後のCD余力
                </div>
                {runningTimers.map((tm) => {
                  const tmRemaining = Math.max(0, (tm.endAt - virtualNow) - (tmSteal > 0 ? tmSteal * 1000 : 0));
                  const subDiff = diffMs - tmRemaining;
                  const isSubPast = subDiff < 0;
                  const displaySubMs = roundUpToSecond(Math.abs(subDiff));
                  const subColor = isSubPast ? colors.red : colors.cyan;

                  return (
                    <div key={tm.id} className="flex justify-between items-center border-b border-white/10 pb-0.5">
                      <span className="font-sans text-[10px] text-whiteCustom font-bold truncate max-w-[80px]">
                        {tm.label || formatTime(tm.totalMs)}
                      </span>
                      <span className="font-mono text-[13px] font-extrabold" style={{ color: subColor }}>
                        {isSubPast ? "−" : "+"}{formatTime(displaySubMs)}
                      </span>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {/* 左スワイプ裏レイヤー: 編集と削除 */}
          <div 
            className="absolute inset-y-0 right-0 w-[140px] flex no-drag transition-opacity duration-150 z-0"
            style={{
              opacity: translateX < 0 ? Math.min(1, Math.abs(translateX) / 35) : 0
            }}
          >
            <button
              onClick={(e) => {
                e.stopPropagation();
                setTranslateX(0);
                swipeState.current = 'closed';
                onEditLabel(item.id, item.label || "");
              }}
              className="flex-1 border-none bg-blueCustom text-white font-sans text-xs font-bold cursor-pointer active:brightness-90"
            >
              ✏️<br />ラベル
            </button>
            <button
              onClick={(e) => {
                e.stopPropagation();
                onDelete(item.id);
              }}
              className="flex-1 border-none bg-redCustom text-white font-sans text-xs font-bold cursor-pointer active:brightness-90"
            >
              🗑<br />削除
            </button>
          </div>

          {/* スライドカード表面 */}
          <div
            ref={cardRef}
            onPointerDown={handlePointerDown}
            onPointerMove={handlePointerMove}
            onPointerUp={handlePointerUp}
            onPointerCancel={handlePointerCancel}
            onClick={handleCardClick}
            className="relative bg-card border rounded-xl p-[6px_8px] flex items-center gap-1.5 select-none h-full transition-[border-color,box-shadow,transform] cursor-grab active:cursor-grabbing z-10"
            style={{
              borderColor: isPast ? colors.red : isNear ? colors.amber : isRightSwiped ? colors.cyanCustom : colors.border,
              boxShadow: isPast ? `0 0 10px ${colors.redGlow}` : isRightSwiped ? `0 0 12px ${colors.cyanGlow}` : "none",
              transform: `translateX(${translateX}px)`,
              touchAction: 'pan-y'
            }}
          >
            <div 
              className="absolute left-0 top-0 bottom-0 w-[3px] rounded-[12px_0_0_12px]" 
              style={{ background: currentColor, opacity: isPast ? 1 : isNear ? 0.9 : 0.35 }}
            />
            
            <div className="flex flex-col gap-[1px] pl-1 shrink-0 no-drag">
              <button 
                onClick={(e) => { e.stopPropagation(); onMoveUp(); }}
                className="text-[11px] leading-none cursor-pointer p-0.5 bg-transparent border-none outline-none active:scale-125 font-sans"
                style={{ color: isFirst ? colors.border : colors.muted, opacity: isFirst ? 0.15 : 0.7 }}
                disabled={isFirst}
              >
                ▲
              </button>
              <button 
                onClick={(e) => { e.stopPropagation(); onMoveDown(); }}
                className="text-[11px] leading-none cursor-pointer p-0.5 bg-transparent border-none outline-none active:scale-125 font-sans"
                style={{ color: isLast ? colors.border : colors.muted, opacity: isLast ? 0.15 : 0.7 }}
                disabled={isLast}
              >
                ▼
              </button>
            </div>

            <div className="flex-1 min-w-0 pr-1">
              <div className="font-sans text-[13px] text-mutedLight mb-[1px] tracking-[0.5px] flex items-baseline gap-1 overflow-hidden whitespace-nowrap">
                {item.label && <span className="text-whiteCustom font-bold overflow-hidden text-ellipsis max-w-[80px] shrink-0">{item.label}</span>}
                <span className="font-mono text-[11px] text-mutedCustom shrink-0">{targetTimeString} まで</span>
                {steal > 0 && <span className="text-amberDim text-[10px] shrink-0">−{steal}s</span>}
                {isPast && <span className="text-redCustom text-[10px] shrink-0 font-bold">経過</span>}
                {isNear && !isPast && <span className="text-amberCustom text-[10px] shrink-0">⚡</span>}
              </div>
              <div 
                className="font-mono font-bold tracking-[0.5px] leading-none font-cd-digits truncate"
                style={{ 
                  color: currentColor,
                  fontSize: isRightSwiped ? '24px' : 'clamp(28px, 9vw, 36px)'
                }}
              >
                {isPast ? "+" : ""}{formatTime(displayMs)}
              </div>
            </div>

            <div className="shrink-0 flex flex-col items-end justify-center pl-1 border-l border-white/5 no-drag">
              {isRightSwiped ? (
                <div className="text-right">
                  <div className="text-[8px] font-bold text-amberCustom tracking-wide">CD現在値</div>
                  <div className="text-[9px] font-mono text-mutedLight">戻す</div>
                </div>
              ) : (
                runningTimers.length > 0 && (
                  <div className="flex items-center gap-0.5 text-[9px] text-cyanCustom font-bold tracking-tight bg-cyanCustom/10 px-1.5 py-0.5 rounded border border-cyanCustom/40">
                    <span>▶TM差</span>
                  </div>
                )
              )}
            </div>
          </div>
        </div>
      );
    }

    function CountdownManager({ 
      targets, 
      setTargets, 
      clipboardVal, 
      stealSec, 
      setStealSec, 
      tmStealSec = 0, 
      onOpenOutput, 
      timers = [], 
      timeOffset = 0,
      quickWords,
      setQuickWords
    }) {
      const [inputVal, setInputVal] = useState("");
      const [labelVal, setLabelVal] = useState("");
      const [presets, setPresets] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem("tk_cd_presets") || "[]");
        } catch(_) { return []; }
      });
      const [presetModalOpen, setPresetModalOpen] = useState(false);
      const [presetEditTarget, setPresetEditTarget] = useState(null);
      const [presetModalLabel, setPresetModalLabel] = useState("");
      const [presetModalInput, setPresetModalInput] = useState("");
      const [anyDragging, setAnyDragging] = useState(false);
      const [labelEditItem, setLabelEditItem] = useState(null);
      const [wordEditTarget, setWordEditTarget] = useState(null);
      const [wordEditInput, setWordEditInput] = useState("");

      const inputRef = useRef(null);
      const scrollContainerRef = useRef(null);
      const wordModalInputRef = useRef(null);
      const presetModalInputRef = useRef(null);

      const wordModalViewport = useKeyboardSafeViewport(wordEditTarget !== null);

      useLowPowerTrigger(targets.length > 0 || timers.some(t => t.running) ? "low" : "none");

      useEffect(() => {
        if (!scrollContainerRef.current) return;

        const sortable = Sortable.create(scrollContainerRef.current, {
          delay: 400,
          delayOnTouchOnly: true,
          touchStartThreshold: 8,
          animation: 200,
          ghostClass: 'sortable-ghost',
          chosenClass: 'sortable-chosen',
          filter: '.no-drag',
          preventOnFilter: false,
          
          onStart: function () {
            setAnyDragging(true);
            if (navigator.vibrate) navigator.vibrate(30);
          },
          onEnd: function (evt) {
            setAnyDragging(false);
            if (evt.oldIndex == null || evt.newIndex == null || evt.oldIndex === evt.newIndex) return;

            setTargets(prev => {
              const next = [...prev];
              const [moved] = next.splice(evt.oldIndex, 1);
              next.splice(evt.newIndex, 0, moved);
              return next;
            });
          }
        });

        return () => {
          sortable.destroy();
        };
      }, []);

      useEffect(() => {
        if (clipboardVal) setInputVal(clipboardVal);
      }, [clipboardVal]);

      const addTarget = (rawTime, label) => {
        const t = buildCountdownTarget(rawTime, label, timeOffset);
        if (t) setTargets(prev => [...prev, t]);
      };

      const handleAddSubmit = () => {
        if (parsedInput) {
          addTarget(inputVal, labelVal);
          setLabelVal("");
          setInputVal("");
          inputRef.current?.focus();
        }
      };

      const openNewPresetDialog = () => {
        setPresetEditTarget(null);
        setPresetModalLabel(labelVal || "");
        setPresetModalInput(inputVal || "");
        setPresetModalOpen(true);
      };

      const openEditPresetDialog = (preset, idx) => {
        setPresetEditTarget({ preset, index: idx });
        setPresetModalLabel(preset.label);
        setPresetModalInput(preset.raw);
        setPresetModalOpen(true);
      };

      const savePreset = () => {
        const parsed = parseInputDigits(presetModalInput);
        if (!parsed) return;
        const label = presetModalLabel || parsed.str;
        const newPreset = {
          id: presetEditTarget ? presetEditTarget.preset.id : Date.now(),
          raw: presetModalInput,
          label,
          str: parsed.str
        };

        let updated;
        if (presetEditTarget !== null) {
          updated = [...presets];
          updated[presetEditTarget.index] = newPreset;
        } else {
          updated = [...presets, newPreset];
        }

        setPresets(updated);
        try { localStorage.setItem("tk_cd_presets", JSON.stringify(updated)); } catch(_) {}
        setPresetModalOpen(false);
      };

      const deletePreset = () => {
        if (presetEditTarget === null) return;
        const updated = presets.filter((_, idx) => idx !== presetEditTarget.index);
        setPresets(updated);
        try { localStorage.setItem("tk_cd_presets", JSON.stringify(updated)); } catch(_) {}
        setPresetModalOpen(false);
      };

      const reorderItems = (index, direction) => {
        setTargets(prev => {
          const next = [...prev];
          const swapIdx = index + direction;
          if (swapIdx < 0 || swapIdx >= next.length) return prev;
          [next[index], next[swapIdx]] = [next[swapIdx], next[index]];
          return next;
        });
      };

      const handleSaveLabel = () => {
        if (!labelEditItem) return;
        setTargets(prev => prev.map(t => t.id === labelEditItem.id ? { ...t, label: labelEditItem.label.trim() } : t));
        setLabelEditItem(null);
      };

      const handleSaveCustomWord = () => {
        if (wordEditTarget === null || !wordEditInput.trim()) return;
        const nextWords = [...quickWords];
        nextWords[wordEditTarget] = wordEditInput.trim();
        setQuickWords(nextWords);
        try { localStorage.setItem("tk_quick_label_words", JSON.stringify(nextWords)); } catch(_) {}
        setWordEditTarget(null);
      };

      const parsedInput = parseInputDigits(inputVal);
      const parsedPresetModal = parseInputDigits(presetModalInput);

      return (
        <div className="h-full flex flex-col p-[8px_10px] gap-1 overflow-hidden">
          <div className="bg-card rounded-xl p-[8px_10px] border border-border shrink-0 no-drag">
            {/* 2秒盗みボタンは最下部の帯（右下）へ移動した（v12） */}

            {/* 2. タイムショートカット */}
            <div style={{ ...labelStyle, fontSize: 8, marginBottom: 4 }}>
              プリセット <span className="opacity-40">長押しで編集</span>
            </div>
            <div className="flex gap-[5px] overflow-x-auto pb-1 mb-1.5 no-scrollbar">
              {presets.map((p, idx) => (
                <PresetKey 
                  key={p.id} 
                  preset={p} 
                  onTap={() => addTarget(p.raw, p.label)} 
                  onLongPress={() => openEditPresetDialog(p, idx)}
                  onLongPressEnd={() => presetModalInputRef.current?.focus()}
                />
              ))}
              <button
                onClick={openNewPresetDialog}
                className="px-2 py-1 border border-dashed border-mutedCustom rounded-[7px] text-[10px] text-mutedCustom font-sans font-bold cursor-pointer shrink-0"
              >
                ＋
              </button>
            </div>

            {/* 3+4. 時間入力(コンパクト・主役・リアルタイムプレビュー) + ラベル入力 */}
            <div style={{ ...labelStyle, fontSize: 8, marginBottom: 3 }}>
              目標時刻<span className="opacity-40">(6桁: 時分秒)</span>
            </div>
            <div className="flex gap-1.5 mb-1.5">
              <div className="relative w-[145px] shrink-0">
                <input
                  ref={inputRef}
                  type="text"
                  name="cd-target-digits"
                  inputMode="numeric"
                  pattern="[0-9]*"
                  autoComplete="off"
                  autoCorrect="off"
                  autoCapitalize="none"
                  spellCheck={false}
                  data-form-type="other"
                  data-lpignore="true"
                  value={inputVal}
                  onChange={(e) => setInputVal(e.target.value.replace(/\D/g, "").slice(0, 6))}
                  onFocus={() => setInputVal("")}
                  onKeyDown={(e) => e.key === "Enter" && handleAddSubmit()}
                  placeholder="143000"
                  className="bg-bg border-[1.5px] border-amberCustom rounded-lg p-[8px_44px_8px_10px] text-amberCustom text-[20px] font-mono tracking-[2px] outline-none w-full box-border animate-none"
                />
                {parsedInput && (
                  <div className="absolute right-2.5 top-1/2 -translate-y-1/2 font-mono text-[10px] text-amberDim pointer-events-none animate-none">
                    {parsedInput.str}
                  </div>
                )}
              </div>
              <input
                type="text"
                name="cd-item-label"
                readOnly
                onPointerDown={(e) => e.target.removeAttribute("readonly")}
                value={labelVal}
                onChange={(e) => setLabelVal(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && handleAddSubmit()}
                placeholder="ラベル（省略可）"
                autoComplete="off"
                autoCorrect="off"
                autoCapitalize="none"
                spellCheck={false}
                data-form-type="other"
                data-lpignore="true"
                className="flex-1 min-w-0 bg-bg border border-border rounded-lg p-[6px_8px] text-mutedLight text-[14px] font-sans outline-none animate-none"
              />
              <button
                onClick={handleAddSubmit}
                disabled={!parsedInput}
                className="px-3.5 py-1.5 rounded-lg text-xs font-sans font-bold cursor-pointer shrink-0"
                style={{
                  background: parsedInput ? colors.amber : colors.gray,
                  color: parsedInput ? "#06060e" : colors.muted
                }}
              >
                ＋
              </button>
            </div>

            {/* 5. ラベルショートカット */}
            <div className="flex items-center gap-1.5 overflow-x-auto pb-0.5 no-scrollbar no-drag">
              <span className="text-[8px] text-mutedCustom whitespace-nowrap">長押し編集:</span>
              {quickWords.map((w, idx) => (
                <QuickLabelChip
                  key={idx}
                  word={w}
                  onSelect={(word) => setLabelVal(word)}
                  onLongPress={() => {
                    setWordEditTarget(idx);
                    setWordEditInput(w);
                  }}
                  onLongPressEnd={() => wordModalInputRef.current?.focus()}
                />
              ))}
            </div>
          </div>

          <div 
            ref={scrollContainerRef} 
            className={`flex-1 ${anyDragging ? 'overflow-hidden' : 'overflow-y-auto'}`}
          >
            {targets.length === 0 ? (
              <div className="text-center py-[20px] text-mutedCustom font-sans text-xs border border-dashed border-border rounded-xl no-drag">
                ⏳ カウントダウンを追加<br />
                <span className="text-[10px] opacity-60 text-cyanCustom">👉右スワイプでTM稼働差分を確認</span>
              </div>
            ) : (
              targets.map((item, idx) => (
                <CountdownItem
                  key={item.id}
                  item={item}
                  steal={stealSec}
                  tmSteal={tmStealSec}
                  timers={timers}
                  timeOffset={timeOffset}
                  isFirst={idx === 0}
                  isLast={idx === targets.length - 1}
                  onDelete={(id) => setTargets(prev => prev.filter(t => t.id !== id))}
                  onMoveUp={() => reorderItems(idx, -1)}
                  onMoveDown={() => reorderItems(idx, 1)}
                  onOpenOutput={onOpenOutput}
                  onEditLabel={(id, label) => setLabelEditItem({ id, label })}
                />
              ))
            )}
          </div>

          {/* ラベル編集モーダル */}
          {labelEditItem && (
            <div 
              className="fixed inset-0 z-[500] bg-black/90 backdrop-blur-[6px] flex items-start justify-center pt-[14vh] p-4"
              onClick={() => setLabelEditItem(null)}
            >
              <div 
                className="bg-card border border-border rounded-[20px] p-[18px] w-full max-w-[320px] shadow-2xl"
                onClick={(e) => e.stopPropagation()}
              >
                <div style={{ ...labelStyle, marginBottom: 10 }}>ラベルを編集</div>
                <input
                  autoFocus
                  type="text"
                  name="edit-item-label"
                  autoComplete="off"
                  autoCorrect="off"
                  autoCapitalize="none"
                  spellCheck={false}
                  data-form-type="other"
                  data-lpignore="true"
                  value={labelEditItem.label}
                  onChange={(e) => setLabelEditItem({ ...labelEditItem, label: e.target.value })}
                  onKeyDown={(e) => e.key === "Enter" && handleSaveLabel()}
                  className="bg-bg border border-blueCustom rounded-[10px] px-[12px] py-2 text-whiteCustom text-[15px] outline-none w-full box-border mb-2"
                  placeholder="ラベルを入力"
                />
                <div className="flex gap-1 overflow-x-auto pb-2 mb-3 no-scrollbar">
                  {quickWords.map((w, idx) => (
                    <button

                <input
                  autoFocus

                  placeholder="143000"

                <label className="text-[9px] text-mutedLight tracking-[1px] mb-1 block">プリセット名称</label>

                  onChange={(e) => setPresetModalLabel(e.target.value)}
                  placeholder={parsedPresetModal ? parsedPresetModal.str : "ラベル（省略可）"}
                  className="bg-bg border border-border rounded-[10px] px-[12px] py-2 text-whiteCustom text-[14px] outline-none w-full box-border mb-2 text-center animate-none"
                />
                <div className="flex gap-1 overflow-x-auto pb-2 mb-3 no-scrollbar">
                  {quickWords.map((w, idx) => (
                    <button
                      key={idx}

                  {presetEditTarget && (
                    <button
