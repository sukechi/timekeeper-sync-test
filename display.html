<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TimeKeeper 表示（iPhone同士連携テスト）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #06060e;
    color: #f5f2ea;
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    overflow: hidden;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 2.2vh 2.5vw;
  }
  .mono { font-family: "Share Tech Mono", "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

  /* 上段: 左=現在時刻 / 右=全体経過＋押し具合 */
  .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 2vw;
  }
  .block-label {
    font-size: clamp(12px, 1.6vw, 20px);
    letter-spacing: 0.25em;
    color: #9a97a8;
    margin-bottom: 0.4vh;
  }
  #clock {
    font-size: clamp(34px, 4.6vw, 68px);
    font-weight: 700;
    line-height: 1;
  }
  #clock-date {
    font-size: clamp(13px, 1.5vw, 20px);
    color: #9a97a8;
    margin-top: 0.6vh;
  }
  .top-right { text-align: right; }
  #overall {
    font-size: clamp(30px, 4vw, 60px);
    font-weight: 700;
    line-height: 1;
  }
  #diff {
    font-size: clamp(20px, 2.6vw, 40px);
    font-weight: 700;
    margin-top: 0.8vh;
    color: #9a97a8;
  }
  #diff.over { color: #ff5252; }

  /* 中央: メインタイマー特大 */
  .center {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  #main-label {
    font-size: clamp(22px, 3.4vw, 52px);
    font-weight: 600;
    color: #f0a030;
    letter-spacing: 0.08em;
    text-align: center;
    max-width: 92vw;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #main-time {
    font-size: clamp(80px, 17vw, 280px);
    font-weight: 800;
    line-height: 1.05;
    text-align: center;
    text-shadow: 0 0 60px rgba(240, 160, 48, 0.18);
  }
  #main-time.over { color: #ff5252; text-shadow: 0 0 60px rgba(255, 82, 82, 0.25); }
  #main-time.done { color: #57d977; text-shadow: 0 0 60px rgba(87, 217, 119, 0.25); }
  #main-sub {
    font-size: clamp(16px, 2.2vw, 34px);
    color: #9a97a8;
    margin-top: 1vh;
  }
  #main-sub .out-tag {
    color: #f0a030;
    border: 1px solid #f0a030;
    border-radius: 999px;
    padding: 0.05em 0.6em;
    margin-right: 0.6em;
    font-size: 0.78em;
    letter-spacing: 0.1em;
  }

  /* 下段: 操作側と同じタブの一覧 */
  .list-wrap {
    border-top: 1px solid #26263a;
    padding-top: 1.2vh;
    margin-top: 0.6vh;
  }
  .list-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 2vw;
    margin-bottom: 0.9vh;
  }
  #list-title {
    font-size: clamp(14px, 1.8vw, 24px);
    letter-spacing: 0.18em;
    color: #9a97a8;
  }
  #list-title b { color: #f5f2ea; font-weight: 700; }
  #conn {
    font-size: clamp(12px, 1.4vw, 18px);
    color: #6d6a7d;
    text-align: right;
    white-space: nowrap;
  }
  #conn .dot {
    display: inline-block;
    width: 0.6em; height: 0.6em;
    border-radius: 50%;
    background: #666;
    margin-right: 0.4em;
    vertical-align: baseline;
  }
  #conn.ok .dot { background: #57d977; }
  #conn.ng .dot { background: #ff5252; }
  .list-subhead {
    font-size: clamp(12px, 1.5vw, 20px);
    letter-spacing: 0.18em;
    color: #9a97a8;
    margin: 0.7vh 0 0.5vh;
  }
  .rows {
    display: flex;
    flex-direction: column;
    gap: 0.6vh;
    max-height: 13vh;
    overflow: hidden;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 1.2vw;
    padding: 0.65vh 1vw;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.03);
    border-left: 4px solid transparent;
    min-height: 0;
  }
  .row.is-main {
    border-left-color: #f0a030;
    background: rgba(240, 160, 48, 0.09);
  }
  .row .r-label {
    flex: 1;
    font-size: clamp(16px, 2vw, 30px);
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row .r-sub {
    font-size: clamp(12px, 1.4vw, 20px);
    color: #9a97a8;
    white-space: nowrap;
  }
  .row .r-time {
    font-size: clamp(18px, 2.4vw, 36px);
    font-weight: 700;
    white-space: nowrap;
  }
  .row .r-time.over { color: #ff5252; }
  .row .r-state {
    font-size: clamp(11px, 1.3vw, 18px);
    padding: 0.15em 0.7em;
    border-radius: 999px;
    background: #26263a;
    color: #c9c6d8;
    white-space: nowrap;
  }
  .row .r-state.run { background: rgba(64, 140, 255, 0.25); color: #7db4ff; }
  .row .r-state.done { background: rgba(87, 217, 119, 0.2); color: #57d977; }
  .row .r-state.over { background: rgba(255, 82, 82, 0.2); color: #ff5252; }
  .row .r-badge {
    font-size: clamp(11px, 1.3vw, 18px);
    padding: 0.15em 0.6em;
    border-radius: 999px;
    white-space: nowrap;
  }
  .row .r-badge.out { color: #f0a030; border: 1px solid #f0a030; }
  .row .r-badge.next { color: #9a97a8; border: 1px solid #4a4763; }
  .row-empty {
    font-size: clamp(14px, 1.8vw, 24px);
    color: #6d6a7d;
    padding: 0.8vh 0.4vw;
  }
</style>
</head>
<body>
  <div class="top">
    <div>
      <div class="block-label">現在時刻</div>
      <div id="clock" class="mono">--:--:--</div>
      <div id="clock-date"></div>
    </div>
    <div class="top-right">
      <div class="block-label">全体経過</div>
      <div id="overall" class="mono">--:--</div>
      <div id="diff" class="mono"></div>
    </div>
  </div>

  <div class="center">
    <div id="main-label">接続待ち</div>
    <div id="main-time" class="mono">--:--</div>
    <div id="main-sub">操作側（iPhone）の接続を待っています</div>
  </div>

  <div class="list-wrap">
    <div class="list-head">
      <div id="list-title"><b>TM / CD</b> 一覧</div>
      <div id="conn" class="ng"><span class="dot"></span><span id="conn-text">未接続</span></div>
    </div>
    <div class="list-subhead">TM（タイマー）</div>
    <div id="tm-rows" class="rows"><div class="row-empty">操作側の接続を待っています</div></div>
    <div class="list-subhead">CD（カウントダウン）</div>
    <div id="cd-rows" class="rows"><div class="row-empty">操作側の接続を待っています</div></div>
  </div>

<script>
(function () {
  var state = null;      // 操作側から届いた最新状態
  var skewMs = 0;        // 操作側時計 - 表示側時計 の推定ずれ
  var connected = false;

  var $ = function (id) { return document.getElementById(id); };

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  // ミリ秒 -> M:SS（1時間以上は H:MM:SS）。負数・超過は呼び出し側で符号を付ける
  function fmt(ms) {
    var abs = Math.abs(ms);
    var h = Math.floor(abs / 3600000);
    var m = Math.floor((abs % 3600000) / 60000);
    var s = Math.floor((abs % 60000) / 1000);
    if (h > 0) return h + ":" + pad(m) + ":" + pad(s);
    return m + ":" + pad(s);
  }

  // 秒へ切り上げ（本体のモニター出力表示に合わせる）
  function fmtCeil(ms) {
    return fmt(Math.ceil(Math.max(0, ms) / 1000) * 1000);
  }

  // ===== カウントダウン表示の丸め（操作側の本体・モニター出力と完全一致） =====
  // 操作側の規則（controller.html の roundUpToSecond / formatTime）:
  //   残り時間は「秒へ切り上げ」、超過分は「絶対値を切り捨て」。
  // 以前は表示側の一部（メイン・一覧行）が切り捨てで計算しており、
  // 操作側よりほぼ常時1秒小さい数字が出ていた（実機で「表示側が1秒遅れる」見え方）。
  // ここに集約し、メイン・一覧の全経路で同じ規則を使う。

  // TMメイン用（本体の別モニター出力＝FloatingOutput と同じ規則。
  // 超過判定も steal 適用後の残りで行う）
  function tmMainView(tm, vNow, tmSteal) {
    var base = tm.running ? (tm.endAt - vNow) : tm.remaining;
    var off = tmSteal > 0 ? base - tmSteal * 1000 : base;
    if (tm.done) return { text: "完了", over: false, done: true, base: base, off: off };
    if (off < 0) return { text: "+" + fmt(Math.abs(off)), over: true, done: false, base: base, off: off };
    return { text: fmtCeil(off), over: false, done: false, base: base, off: off };
  }

  // TM一覧行用（本体のTMカード＝TimerItem と同じ規則。
  // 超過判定は steal を引く前の残りで行い、超過表示にも steal を適用しない）
  function tmRowView(tm, vNow, tmSteal) {
    var delta = tm.running ? (tm.endAt - vNow) : tm.remaining;
    if (tm.done) return { text: "完了", over: false, done: true };
    if (delta < 0) return { text: "+" + fmt(Math.abs(delta)), over: true, done: false };
    var off = tmSteal > 0 ? delta - tmSteal * 1000 : delta;
    return { text: fmtCeil(Math.max(0, off)), over: false, done: false };
  }

  // CD用（本体のCDカード＝CountdownItem／別モニター出力と同じ規則。
  // steal は常時適用し、目標ちょうど（残り0）も「過ぎた」側に倒す）
  function cdView(item, vNow, cdSteal) {
    var diff = item.target - vNow - (cdSteal > 0 ? cdSteal * 1000 : 0);
    if (diff <= 0) return { text: "+" + fmt(Math.abs(diff)), over: true };
    return { text: fmtCeil(diff), over: false };
  }

  function clockStr(ts) {
    var d = new Date(ts);
    return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  }

  // 操作側の「いま」（仮想時刻 = 実時刻 + timeOffset、時計ずれ補正込み）
  function controllerNow() {
    var offset = state && typeof state.timeOffset === "number" ? state.timeOffset : 0;
    return Date.now() + skewMs + offset;
  }

  function swElapsed(sw, nowReal) {
    if (!sw) return 0;
    return sw.running ? sw.accumulated + (nowReal - sw.startedAt) : sw.accumulated;
  }

  // 別モニター出力の対象を引く（選ばれていて実在するときだけ）
  // 表示側に出すのは TM / CD のみ（ユーザー指定）。SW が出力に選ばれていても
  // 表示側のメインには使わない（TM/CD の通常ルールに落とす）。
  function resolveOutput(st) {
    var key = st.activeOutputKey;
    if (!key || !key.type) return null;
    if (key.type === "tm") {
      var timers = st.timers || [];
      for (var i = 0; i < timers.length; i++) if (timers[i].id === key.id) return { kind: "tm", item: timers[i] };
      return null;
    }
    if (key.type === "cd") {
      var cds = st.countdownTargets || [];
      for (var j = 0; j < cds.length; j++) if (cds[j].id === key.id) return { kind: "cd", item: cds[j] };
      return null;
    }
    return null;
  }

  // 出力が選ばれていないときのメイン選択。
  // 操作側のタブには連動しない（タブを切り替えてもメインは切り替わらない）。
  // 動作中のTM → 最も近いCD → 先頭のTM の順。
  function pickMain(st) {
    var timers = st.timers || [];
    var cds = st.countdownTargets || [];
    var runningTm = null, firstTm = null;
    for (var i = 0; i < timers.length; i++) {
      if (!firstTm) firstTm = timers[i];
      if (timers[i].running && !runningTm) runningTm = timers[i];
    }
    var nearestCd = null;
    for (var j = 0; j < cds.length; j++) {
      if (!nearestCd || cds[j].target < nearestCd.target) nearestCd = cds[j];
    }
    if (runningTm) return { kind: "tm", item: runningTm };
    if (nearestCd) return { kind: "cd", item: nearestCd };
    if (firstTm) return { kind: "tm", item: firstTm };
    return { kind: "none", item: null };
  }

  // メイン表示の内容を組み立てる。
  // 出力の選択有無にかかわらず、本体のモニター出力と同じ計算・丸めにそろえる
  // （ラベル表記だけが出力選択時に「ラベル [全体]」になる）。
  function buildMainView(st, vNow, realNow) {
    var output = resolveOutput(st);
    var fromOutput = !!output;
    var main = output || pickMain(st);
    var tmSteal = typeof st.tmSteal === "number" ? st.tmSteal : 0;
    var cdSteal = typeof st.cdSteal === "number" ? st.cdSteal : 0;
    var view = { kind: main.kind, item: main.item, fromOutput: fromOutput, over: false, done: false, elapsedMs: 0, diffMs: null };

    if (main.kind === "tm") {
      var tm = main.item;
      var mv = tmMainView(tm, vNow, tmSteal);
      view.label = fromOutput
        ? (tm.label ? (tm.label + " [" + fmt(tm.totalMs) + "]") : fmt(tm.totalMs))
        : (tm.label || "タイマー");
      view.done = mv.done;
      view.over = mv.over;
      view.timeText = mv.text;
      view.subText = mv.done ? "完了" : (tm.running ? "進行中" : "停止中");
      view.diffMs = (tm.running && !mv.done) ? mv.off : null;
      view.elapsedMs = tm.totalMs - mv.base;
    } else if (main.kind === "cd") {
      var item = main.item;
      var cv = cdView(item, vNow, cdSteal);
      view.label = item.label || clockStr(item.target);
      view.over = cv.over;
      view.timeText = cv.text;
      view.subText = cv.over ? "時刻を過ぎています" : "目標時刻まで";
      view.diffMs = null;
    } else {
      view.label = "TM / CD";
      view.timeText = "--:--";
      view.subText = "動作中のタイマーはありません";
    }
    return view;
  }

  // 「つぎ」の対象ID（TM: メインの後ろの未完了 / CD: メインより後の最も近い目標）
  function pickNextId(st, main) {
    if (!main) return null;
    var i, idx;
    if (main.kind === "tm") {
      var timers = st.timers || [];
      idx = timers.indexOf(main.item);
      for (i = idx + 1; i < timers.length; i++) if (!timers[i].done) return "tm:" + timers[i].id;
      return null;
    }
    if (main.kind === "cd") {
      var cds = (st.countdownTargets || []).slice().sort(function (a, b) { return a.target - b.target; });
      for (i = 0; i < cds.length; i++) {
        if (cds[i].target > main.item.target) return "cd:" + cds[i].id;
      }
      return null;
    }
    return null;
  }

  // ---------------- 一覧（TM一覧＋CD一覧の固定表示） ----------------
  // 操作側のタブには連動しない。TM と CD の両方を常にこの順で出す。
  // SW / CALC は表示側に出さない（ユーザー指定）。
  var sections = {
    tm: { sig: "", kindOf: {}, timeEls: {} },
    cd: { sig: "", kindOf: {}, timeEls: {} }
  };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // 一覧の骨組み（行の並び・ラベル・状態）を作る。時刻だけは毎tick別に更新する。
  function buildTmRows(st, main, output, nextId) {
    var rows = [];
    var timers = st.timers || [];
    for (var i = 0; i < timers.length; i++) {
      var it = timers[i];
      rows.push({
        key: "tm:" + it.id, kind: "tm", item: it,
        label: it.label || fmt(it.totalMs),
        sub: "全 " + fmt(it.totalMs),
        stateText: it.done ? "完了" : (it.running ? "進行中" : "停止中"),
        stateCls: it.done ? "done" : (it.running ? "run" : ""),
        isMain: main.kind === "tm" && main.item === it,
        isOut: !!(output && output.kind === "tm" && output.item === it),
        isNext: nextId === "tm:" + it.id
      });
    }
    if (!rows.length) rows.push({ empty: "タイマーはまだありません" });
    return rows;
  }

  function buildCdRows(st, main, output, nextId, vNow, cdSteal) {
    var rows = [];
    var cds = st.countdownTargets || [];
    for (var i = 0; i < cds.length; i++) {
      var it = cds[i];
      var over = cdView(it, vNow, cdSteal).over;
      rows.push({
        key: "cd:" + it.id, kind: "cd", item: it,
        label: it.label || clockStr(it.target),
        sub: "目標 " + clockStr(it.target),
        stateText: over ? "超過" : "カウント中",
        stateCls: over ? "over" : "",
        isMain: main.kind === "cd" && main.item === it,
        isOut: !!(output && output.kind === "cd" && output.item === it),
        isNext: nextId === "cd:" + it.id
      });
    }
    if (!rows.length) rows.push({ empty: "カウントダウンはまだありません" });
    return rows;
  }

  function renderSection(secName, containerId, rows) {
    var sec = sections[secName];
    var sig = "";
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      sig += "|" + (r.empty || (r.key + ":" + r.stateText + ":" + (r.isMain ? 1 : 0) + ":" + (r.isOut ? 1 : 0) + ":" + (r.isNext ? 1 : 0)));
    }
    if (sig === sec.sig) return;
    sec.sig = sig;
    sec.kindOf = {};
    sec.timeEls = {};
    var html = "";
    for (i = 0; i < rows.length; i++) {
      r = rows[i];
      if (r.empty) { html += '<div class="row-empty">' + esc(r.empty) + "</div>"; continue; }
      html += '<div class="row' + (r.isMain ? " is-main" : "") + '">' +
        '<div class="r-label">' + esc(r.label) + "</div>" +
        (r.sub ? '<div class="r-sub mono">' + esc(r.sub) + "</div>" : "") +
        '<div class="r-time mono" data-k="' + esc(r.key) + '">--:--</div>' +
        '<div class="r-state ' + esc(r.stateCls || "") + '">' + esc(r.stateText) + "</div>" +
        (r.isOut ? '<div class="r-badge out">出力中</div>' : "") +
        (r.isNext ? '<div class="r-badge next">つぎ</div>' : "") +
        "</div>";
      sec.kindOf[r.key] = r;
    }
    $(containerId).innerHTML = html;
    var els = $(containerId).querySelectorAll(".r-time");
    for (i = 0; i < els.length; i++) sec.timeEls[els[i].getAttribute("data-k")] = els[i];
  }

  // 時刻の更新（毎tick）。丸めは操作側と同一規則のヘルパーで計算する。
  function updateSectionTimes(secName, st, vNow) {
    var sec = sections[secName];
    var tmSteal = typeof st.tmSteal === "number" ? st.tmSteal : 0;
    var cdSteal = typeof st.cdSteal === "number" ? st.cdSteal : 0;
    for (var key in sec.kindOf) {
      var row = sec.kindOf[key];
      var el = sec.timeEls[key];
      if (!el) continue;
      if (row.kind === "tm") {
        var v = tmRowView(row.item, vNow, tmSteal);
        el.textContent = v.text;
        el.className = "r-time mono" + (v.over ? " over" : "");
      } else if (row.kind === "cd") {
        var cv = cdView(row.item, vNow, cdSteal);
        el.textContent = cv.text;
        el.className = "r-time mono" + (cv.over ? " over" : "");
      }
    }
  }

  function renderList(st, main, output, vNow, realNow) {
    $("list-title").innerHTML = "<b>TM / CD</b> 一覧" +
      (output ? "　／　別モニター出力の内容を共有中" : "");
    var nextId = pickNextId(st, main);
    var cdSteal = typeof st.cdSteal === "number" ? st.cdSteal : 0;
    renderSection("tm", "tm-rows", buildTmRows(st, main, output, nextId));
    renderSection("cd", "cd-rows", buildCdRows(st, main, output, nextId, vNow, cdSteal));
    updateSectionTimes("tm", st, vNow);
    updateSectionTimes("cd", st, vNow);
  }

  function render() {
    // 現在時刻（表示側の実時計）
    var now = new Date();
    $("clock").textContent = pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
    var days = ["日", "月", "火", "水", "木", "金", "土"];
    $("clock-date").textContent = (now.getMonth() + 1) + "月" + now.getDate() + "日（" + days[now.getDay()] + "）";

    if (!state) {
      $("conn").className = connected ? "ok" : "ng";
      $("conn-text").textContent = connected ? "サーバー接続済み・操作側待ち" : "未接続";
      return;
    }
    $("conn").className = connected ? "ok" : "ng";
    $("conn-text").textContent = connected ? "接続中" : "再接続中";

    var vNow = controllerNow();
    var realNow = Date.now() + skewMs;
    var output = resolveOutput(state);
    var view = buildMainView(state, vNow, realNow);

    $("main-label").textContent = view.label;
    var mainTimeEl = $("main-time");
    mainTimeEl.textContent = view.timeText;
    mainTimeEl.className = "mono" + (view.over ? " over" : "") + (view.done ? " done" : "");
    $("main-sub").innerHTML = (view.fromOutput ? '<span class="out-tag">別モニター出力</span>' : "") + esc(view.subText);

    // 全体経過: ストップウォッチを全体タイマーとして使う。未使用ならメインの経過で代用
    var overall = swElapsed(state.stopwatchState, realNow);
    if (overall === 0 && view.elapsedMs > 0) overall = view.elapsedMs;
    $("overall").textContent = fmt(overall);

    // 押し具合: メインTMが超過していれば「押し +M:SS」、進行中なら残りを表示
    // （丸めはメイン表示と同じ: 残りは切り上げ、超過は切り捨て）
    var diffEl = $("diff");
    if (view.kind === "tm" && view.diffMs !== null) {
      if (view.diffMs < 0) {
        diffEl.textContent = "押し +" + fmt(Math.abs(view.diffMs));
        diffEl.className = "mono over";
      } else {
        diffEl.textContent = "残り " + fmtCeil(view.diffMs);
        diffEl.className = "mono";
      }
    } else if (view.kind === "cd" && view.over) {
      diffEl.textContent = "押し " + view.timeText;
      diffEl.className = "mono over";
    } else {
      diffEl.textContent = "";
      diffEl.className = "mono";
    }

    // 下段の一覧（メイン選択に使った main 互換オブジェクトを渡す）
    renderList(state, { kind: view.kind, item: view.item }, output, vNow, realNow);
  }

  // ---------------- WebSocket ----------------
  var retryMs = 1000;
  function connect() {
    var ws;
    try {
      var proto = location.protocol === "https:" ? "wss://" : "ws://";
      ws = new WebSocket(proto + location.host + "/ws");
    } catch (e) { scheduleRetry(); return; }
    ws.onopen = function () { connected = true; retryMs = 1000; render(); };
    ws.onclose = function () { connected = false; scheduleRetry(); render(); };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
    ws.onmessage = function (ev) {
      try {
        var msg = JSON.parse(ev.data);
        if (msg && msg.type === "state" && msg.state) {
          state = msg.state;
          if (typeof state.sentAt === "number") {
            // 操作側との時計ずれを推定（LAN内の遅延はごく小さい前提）
            skewMs = state.sentAt - Date.now();
          }
          render();
        }
      } catch (e) {}
    };
  }
  function scheduleRetry() {
    setTimeout(connect, retryMs);
    retryMs = Math.min(retryMs * 2, 10000);
  }

  connect();

  // iPhone同士連携（P2P）から状態を受け取るためのフック（pair-display.js が使う）
  window.__tkReceiveStateText = function (text) {
    try {
      var msg = JSON.parse(text);
      if (msg && msg.type === "state" && msg.state) {
        state = msg.state;
        if (typeof state.sentAt === "number") {
          skewMs = state.sentAt - Date.now();
        }
        render();
      }
    } catch (e) {}
  };
  window.__tkSetP2PConnected = function (v) {
    connected = !!v;
    render();
  };

  setInterval(render, 100);
  render();
})();
</script>

  <script src="vendor/jsQR.js"></script>
  <script src="vendor/lz-string.min.js"></script>
  <script src="p2p.js"></script>
  <script src="pair-display.js"></script>
